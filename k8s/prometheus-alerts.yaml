apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-capstone-app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: devops-capstone-app
      rules:
        - alert: DevOpsCapstoneAppReplicasUnavailable
          expr: kube_deployment_spec_replicas{namespace="default",deployment="devops-capstone-app"} > on(namespace,deployment) kube_deployment_status_replicas_available{namespace="default",deployment="devops-capstone-app"}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "DevOps Capstone application replicas unavailable"
            description: "One or more desired application replicas are unavailable for more than 2 minutes."

        - alert: DevOpsCapstoneAppContainerRestart
          expr: increase(kube_pod_container_status_restarts_total{namespace="default",pod=~"devops-capstone-app-.*",container="devops-capstone-app"}[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "DevOps Capstone application container restarted"
            description: "An application container has restarted within the last 10 minutes."

        - alert: DevOpsCapstoneAppPodNotReady
          expr: kube_pod_status_ready{namespace="default",pod=~"devops-capstone-app-.*",condition="false"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "DevOps Capstone application pod is not ready"
            description: "An application pod has remained not ready for more than 2 minutes."
